services:
  - type: web
    name: tienda-regalos-pos
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm run build
    startCommand: cd server && npx prisma db push --skip-generate && NODE_ENV=production node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
